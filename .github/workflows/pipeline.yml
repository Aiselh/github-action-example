name: CI/CD Pipeline

on:
  push:
    branches:
      - main

  pull_request:

  workflow_dispatch:


jobs:

  # ============================================================
  # SCM PULL
  # ============================================================
  scm-pull:
    name: SCM Pull
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4


  # ============================================================
  # PARALLEL STAGE
  # ============================================================

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: scm-pull

    steps:
      - name: Docker build
        run: echo "Docker build would run here"


  trivy-scan:
    name: Trivy Scan
    runs-on: ubuntu-latest
    needs: scm-pull

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@e07451d2e059ed86c2870430ea286b3a9e0bf241

      - name: Print Trivy version
        run: trivy --version

      - name: Scan repository filesystem
        run: |
          trivy fs \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            --ignore-unfixed \
            .


  bandit-scan:
    name: Bandit Scan
    runs-on: ubuntu-latest
    needs: scm-pull

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Bandit scan
        run: echo "Bandit scan would run here"


  semgrep-scan:
    name: Semgrep Scan
    runs-on: ubuntu-latest
    needs: scm-pull

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Semgrep scan
        run: echo "Semgrep scan would run here"


  # ============================================================
  # DOCKER PUSH
  # ============================================================

  docker-push:
    name: Docker Push
    runs-on: ubuntu-latest
    needs:
      - docker-build
      - trivy-scan
      - bandit-scan
      - semgrep-scan

    steps:
      - name: Docker push
        run: echo "Docker push would run here"


  # ============================================================
  # UNIT TEST
  # ============================================================

  unit-test:
    name: Unit Test
    runs-on: ubuntu-latest
    needs: docker-push

    steps:
      - name: Run unit tests
        run: echo "Unit tests would run here"


  # ============================================================
  # DEPLOY
  # ============================================================

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: unit-test

    steps:
      - name: Deploy application
        run: echo "Deploy would run here"


  # ============================================================
  # POST-DEPLOY TEST
  # ============================================================

  test:
    name: Post Deploy Test
    runs-on: ubuntu-latest
    needs: deploy

    steps:
      - name: Test deployed application
        run: echo "Post-deployment test would run here"


  # ============================================================
  # POST INSTALL
  # ============================================================

  post-install:
    name: Post Install
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Post install
        run: echo "Post-install tasks would run here"
```

